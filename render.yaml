# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: grocery-store
    runtime: docker
    plan: free
    region: oregon   # must match the Key Value region below (private network)
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Render puts one proxy in front of the service.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # --- E-mail (Resend over HTTPS; unset = preview mode, nothing is sent) ---
      - key: RESEND_API_KEY
        sync: false   # set in the Render dashboard
      - key: EMAIL_FROM
        value: "Grocery Store Demo <demo@mail.driptobhattacharyya.com>"
      # --- Cloudflare Turnstile (human check on the e-mail form) ---
      # A PAIR: TURNSTILE_SECRET_KEY (here, in Render) and VITE_TURNSTILE_SITE_KEY (the frontend
      # build). Create a widget for grocery-store.driptobhattacharyya.com in the Cloudflare dashboard
      # (Turnstile > Add widget). Until the secret is set, real e-mail sending stays OFF (preview
      # mode) even with RESEND_API_KEY; see docs/DEPLOY.md.
      - key: TURNSTILE_SECRET_KEY
        sync: false   # set in the Render dashboard
      - key: TURNSTILE_EXPECTED_HOSTNAME
        value: grocery-store.driptobhattacharyya.com
      - key: CORS_ORIGINS
        value: https://grocery-store.driptobhattacharyya.com
      # Broker for the Celery worker that runs inside the same container.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grocery-store-redis
          property: connectionString

  # Free Key Value (Redis-compatible): Celery broker, shared cache and e-mail counters.
  - type: keyvalue
    name: grocery-store-redis
    plan: free
    region: oregon
    # Celery broker: never evict. Every cache and rate-limit key carries a TTL and the data is
    # tiny, so memory does not fill up; if it ever did, writes fail loudly (the app degrades:
    # cache off, limiter in memory, jobs answer 503) instead of Redis silently dropping queued jobs.
    maxmemoryPolicy: noeviction
    ipAllowList: []   # empty = internal (private network) access only
